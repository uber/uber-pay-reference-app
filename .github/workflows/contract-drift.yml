name: Pinned contract drift
on:
  schedule:
    - cron: '25 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: make setup
      - run: .venv/bin/python tools/check_contract.py --check-live
